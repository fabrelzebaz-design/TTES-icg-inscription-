<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Étudiant - TTES-ICG ACADEMY</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #0F172A; --accent: #2563EB; --bg: #F8FAFC; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg); padding: 40px 20px; display: flex; justify-content: center; }
        .card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); width: 100%; max-width: 600px; border: 1px solid #E2E8F0; }
        .status-badge { text-align: center; color: #16A34A; background: #DCFCE7; padding: 10px; border-radius: 30px; font-weight: 700; margin-bottom: 25px; display: inline-block; width: 100%; }
        h2 { color: var(--primary); font-size: 22px; margin-bottom: 20px; text-align: center; }
        .info-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #F1F5F9; font-size: 15px; }
        .info-row strong { color: #475569; }
        .info-row span { color: var(--primary); font-weight: 600; text-align: right; }
        .actions { margin-top: 30px; display: flex; gap: 15px; }
        .btn { flex: 1; padding: 12px; text-align: center; border-radius: 8px; text-decoration: none; font-weight: 600; cursor: pointer; border: none; }
        .btn-print { background: var(--primary); color: white; }
        .btn-home { background: #E2E8F0; color: #334155; }
        @media print { .actions, header { display: none !important; } .card { box-shadow: none; border: none; } }
    </style>
</head>
<body>

<div class="card" id="studentCard">
    <div class="status-badge"><i class="fas fa-check-circle"></i> Pré-inscription Validée</div>
    <h2>Récapitulatif de votre Dossier</h2>

    <div id="details">
        <p style="text-align: center; color: #64748B;">Chargement des données...</p>
    </div>

    <div class="actions">
        <button class="btn btn-print" onclick="window.print()"><i class="fas fa-print"></i> Imprimer Reçu</button>
        <a href="index.html" class="btn btn-home"><i class="fas fa-home"></i> Accueil</a>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        const detailsContainer = document.getElementById('details');

        if (!id) {
            detailsContainer.innerHTML = '<p style="color: red; text-align: center;">Aucun identifiant trouvé.</p>';
            return;
        }

        try {
            const res = await fetch(`/api/etudiant/${id}`);
            const data = await res.json();

            if (data.success && data.etudiant) {
                const e = data.etudiant;
                detailsContainer.innerHTML = `
                    <div class="info-row"><strong>Matricule / ID :</strong> <span>#TTES-${e.id.toString().padStart(4, '0')}</span></div>
                    <div class="info-row"><strong>Nom complet :</strong> <span>${e.nom}</span></div>
                    <div class="info-row"><strong>Email :</strong> <span>${e.email}</span></div>
                    <div class="info-row"><strong>Téléphone :</strong> <span>${e.telephone}</span></div>
                    <div class="info-row"><strong>Date de Naissance :</strong> <span>${e.date_naissance || 'Non renseignée'}</span></div>
                    <div class="info-row"><strong>Formation :</strong> <span>${e.formation}</span></div>
                    <div class="info-row"><strong>Mode :</strong> <span>${e.mode_formation || 'Présentiel'}</span></div>
                    <div class="info-row"><strong>Date de demande :</strong> <span>${new Date(e.date_inscription).toLocaleDateString('fr-FR')}</span></div>
                `;
            } else {
                detailsContainer.innerHTML = `<p style="color: red; text-align: center;">${data.message || "Étudiant introuvable."}</p>`;
            }
        } catch (err) {
            detailsContainer.innerHTML = '<p style="color: red; text-align: center;">Erreur de chargement des données.</p>';
        }
    });
</script>
</body>
</html>
