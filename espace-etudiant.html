<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Espace Étudiant - TTES-ICG</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #F3F4F6; display: flex; justify-content: center; padding: 40px 20px; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2 { color: #1E40AF; margin-top: 0; }
        .field { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; color: #374151; }
        input, select { width: 100%; padding: 10px; border: 1px solid #D1D5DB; border-radius: 6px; font-size: 15px; }
        input:disabled, select:disabled { background: #F3F4F6; color: #6B7280; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-edit { background: #F59E0B; color: white; }
        .btn-save { background: #10B981; color: white; display: none; }
        .btn-pdf {
    background-color: #059669;
    color: white;
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 20px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: background 0.3s;
}
.btn-pdf:hover {
    background-color: #047857;
}
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

<div class="card">
    <h2>🎓 Mon Espace Inscription</h2>
    <p style="color: #6B7280; font-size: 14px;">Vérifiez ou modifiez vos informations ci-dessous.</p>
    <div style="margin-bottom: 20px; text-align: right;">
        <button id="btn-pdf" type="button" onclick="telechargerPDF()" class="btn-pdf">
            📄 Télécharger ma Fiche d'Inscription (PDF)
        </button>
    </div>

    <form id="studentForm">
        <div class="field">
            <label for="nom">Nom complet</label>
            <input type="text" id="nom" disabled required>
        </div>
        <div class="field">
            <label for="telephone">Téléphone (9 chiffres)</label>
            <input type="tel" id="telephone" maxlength="9" disabled required>
        </div>
        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" disabled required>
        </div>
        <div class="field">
            <label for="formation">Formation choisie</label>
            <select id="formation" disabled required>
                <option value="Intelligence artificielle">Intelligence artificielle</option>
                <option value="Auxiliaire de vie">Auxiliaire de vie</option>
                <option value="Médecine">Médecine</option>
                <option value="Couture">Couture</option>
                <option value="Marketing Digital">Marketing Digital</option>
                <option value="Multi Level Marketing">Multi Level Marketing</option>
                <option value="Coiffure professionnelle">Coiffure professionnelle</option>
            </select>
        </div>

        <div class="btn-group">
            <button type="button" id="btnEdit" class="btn-edit" onclick="activerModification()">✏️ Modifier mes données</button>
            <button type="submit" id="btnSave" class="btn-save">💾 Enregistrer les changements</button>
        </div>
    </form>
</div>

<script>
    // 1. Récupération de l'ID depuis l'URL
    const urlParams = new URLSearchParams(window.location.search);
    const studentId = urlParams.get('id');

    // 2. Fonction de chargement des données étudiant
    async function chargerEtudiant() {
        if (!studentId) return alert("Aucun étudiant spécifié dans l'URL.");
        
        try {
            const res = await fetch(`/api/etudiant/${studentId}`);
            const data = await res.json();

            if (data.success && data.etudiant) {
                document.getElementById('nom').value = data.etudiant.nom || '';
                document.getElementById('telephone').value = data.etudiant.telephone || '';
                document.getElementById('email').value = data.etudiant.email || '';
                document.getElementById('formation').value = data.etudiant.formation || '';
            } else {
                alert("Impossible de charger les données de l'étudiant.");
            }
        } catch (err) {
            console.error("Erreur de chargement :", err);
        }
    }

    // 3. Activation de la modification des champs
    function activerModification() {
        document.querySelectorAll('#studentForm input, #studentForm select').forEach(el => el.disabled = false);
        if (document.getElementById('btnEdit')) document.getElementById('btnEdit').style.display = 'none';
        if (document.getElementById('btnSave')) document.getElementById('btnSave').style.display = 'block';
    }

    // 4. Fonction de téléchargement du PDF professionnel
    function telechargerPDF() {
        // Sélectionne le conteneur principal de la carte / fiche
        const element = document.querySelector('.container') || document.querySelector('.card') || document.body;

        const opt = {
            margin:       10,
            filename:     `Attestation_Inscription_TTES_${studentId || 'Etudiant'}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2 },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        if (typeof html2pdf !== 'undefined') {
            html2pdf().set(opt).from(element).save();
        } else {
            alert("Erreur : La bibliothèque html2pdf n'est pas chargée. Vérifiez que la balise <script> est présente dans la balise <head>.");
        }
    }

    // 5. Initialisation des événements une fois le DOM chargé
    document.addEventListener("DOMContentLoaded", () => {
        // Charger les données de l'étudiant
        chargerEtudiant();

        // Écouteur sur la soumission du formulaire
        const studentForm = document.getElementById('studentForm');
        if (studentForm) {
            studentForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const body = {
                    nom: document.getElementById('nom').value,
                    telephone: document.getElementById('telephone').value,
                    email: document.getElementById('email').value,
                    formation: document.getElementById('formation').value
                };

                try {
                    const res = await fetch(`/api/etudiant/${studentId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });

                    const result = await res.json();
                    alert(result.message);

                    if (result.success) {
                        location.reload();
                    }
                } catch (err) {
                    console.error("Erreur de sauvegarde :", err);
                    alert("Échec de la mise à jour.");
                }
            });
        }
    });
</script>
