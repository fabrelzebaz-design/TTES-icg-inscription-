<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTES-ICG Academy | Formations & Inscription</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .password-container { position: relative; width: 100%; }
        .password-container input { padding-right: 45px; }
        .toggle-btn { position: absolute; right: 15px; top: 15px; background: none; border: none; cursor: pointer; }
        
        /* Styles de la vitrine */
        .vitrine-section { margin-top: 40px; width: 100%; }
        .grid-formations { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .card-formation { background: #fff; border-radius: 12px; padding: 20px; border: 1px solid #E2E8F0; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: left; }
        .card-formation h3 { color: #0F172A; font-size: 1.1rem; margin-bottom: 8px; }
        .card-slogan { font-size: 0.85rem; color: #2563EB; font-style: italic; font-weight: 600; margin-bottom: 12px; }
        .card-price { background: #EFF6FF; padding: 8px; border-radius: 6px; font-weight: 700; color: #1E293B; font-size: 0.9rem; text-align: center; margin-bottom: 15px; }
        .btn-select { background: #2563EB; color: white; border: none; padding: 10px; width: 100%; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .btn-select:hover { background: #1D4ED8; }

        /* Modalite (Présentiel / En Ligne) */
        .modalite-group { display: flex; gap: 15px; margin: 15px 0; justify-content: space-around; }
        .modalite-group label { font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 5px; }
    </style>
</head>
<body>
<div class="container">

    <!-- Carte de bienvenue (Vitrine) -->
    <div class="welcome-card" id="welcomeCard">
        <img src="logo.jpeg" alt="Logo TTES-ICG" class="logo">
        <h1>Bienvenue chez <span>TTES-ICG Academy</span></h1>
        <p>La compétence aujourd'hui, le succès demain ! Découvrez nos formations certifiantes en <strong>Présentiel</strong> ou <strong>En Ligne</strong>.</p>

        <button id="startBtn" type="button" style="margin-bottom: 20px;">S'inscrire directement</button>

        <!-- CATALOGUE DES FORMATIONS -->
        <div class="vitrine-section">
            <h2 style="font-size: 1.3rem; color: #0F172A;">Nos Formations Disponibles</h2>
            <div class="grid-formations" id="gridFormations">
                <!-- Généré dynamiquement en JS -->
            </div>
        </div>
    </div>

    <!-- Carte de formulaire -->
    <div class="form-card" id="formCard" style="display:none;">
        <h2>Créer un compte</h2>
        <form id="registrationForm">
            <input type="text" id="name" placeholder="Nom complet" required>
            
            <!-- Champ téléphone -->
            <input 
                type="tel" 
                id="phone" 
                name="telephone" 
                required 
                minlength="9" 
                maxlength="9" 
                pattern="[0-9]{9}" 
                title="Le numéro de téléphone doit comporter exactement 9 chiffres"
                placeholder="Téléphone (Ex: 699123456)"
            >
            
            <input type="email" id="email" placeholder="Adresse e-mail" required>
            
            <label for="birthdate" style="display:block; margin-top:10px; font-size:14px; text-align: left;">Date de naissance</label>
            <input type="date" id="birthdate" required>
            
            <!-- Choix du Mode d'apprentissage -->
            <label style="display:block; margin-top:10px; font-size:14px; text-align: left; font-weight:600;">Mode d'apprentissage :</label>
            <div class="modalite-group">
                <label><input type="radio" name="modalite" value="Présentiel" checked> 🏫 Présentiel</label>
                <label><input type="radio" name="modalite" value="En ligne"> 💻 En Ligne</label>
            </div>

            <div class="password-container">
                <input type="password" id="password" placeholder="Mot de passe (min. 6 caractères)" required>
                <button type="button" id="togglePassword" class="toggle-btn">👁️</button>
            </div>
            
            <div class="password-container">
                <input type="password" id="confirmPassword" placeholder="Confirmer mot de passe" required>
                <button type="button" id="toggleConfirmPassword" class="toggle-btn">👁️</button>
            </div>

            <!-- Liste officielle mise à jour selon tes prospectus -->
            <select id="formation" required>
                <option value="">Choisir une formation</option>
                <option value="Administration de Bases de Données">Administration de Bases de Données</option>
                <option value="Intelligence Artificielle (IA)">Intelligence Artificielle (IA)</option>
                <option value="Community Management & E-Commerce">Community Management & E-Commerce</option>
                <option value="Montage Audio-Visuel">Montage Audio-Visuel</option>
                <option value="Management des Entreprises">Management des Entreprises</option>
                <option value="Commerce International">Commerce International</option>
                <option value="Pack Spécial 4 en 1 (3 Jours)">Pack Spécial 4 en 1 (3 Jours)</option>
                <option value="Consultation & Diagnostic d'Entreprise">Consultation & Diagnostic d'Entreprise</option>
            </select>

            <button type="submit">Créer mon compte</button>
            <p id="message" style="margin-top: 15px; text-align: center; font-weight: 500;"></p>
        </form>
    </div>
</div>

<script src="script.js" defer></script>
<script>
    // Catalogue officiel de TTES-ICG
    const catalogue = [
        {
            titre: "Administration de Bases de Données",
            slogan: "« Devenez l'expert indispensable qui protège et organise les données ! »",
            prix: "10 000 F / 375 000 F / 650 000 F"
        },
        {
            titre: "Intelligence Artificielle (IA)",
            slogan: "« Dominez le futur : automatisez vos tâches et boostez votre productivité ! »",
            prix: "10 000 F / 375 000 F / 650 000 F"
        },
        {
            titre: "Community Management & E-Commerce",
            slogan: "« Transformez les réseaux sociaux en machine à vendre ! »",
            prix: "10 000 F / 375 000 F / 650 000 F"
        },
        {
            titre: "Montage Audio-Visuel",
            slogan: "« La formation qui paie ta scolarité : vivez de vos créations vidéo ! »",
            prix: "10 000 F / 375 000 F / 650 000 F"
        },
        {
            titre: "Management des Entreprises",
            slogan: "« Développez votre leadership et piloter des projets complexes. »",
            prix: "10 000 F / 375 000 F / 650 000 F"
        },
        {
            titre: "Pack Spécial 4 en 1 (3 Jours)",
            slogan: "« MLM, Marketing Digital, Automatisation & IA en 3 jours chrono ! »",
            prix: "25 000 FCFA (Offre spéciale)"
        }
    ];

    // Génération des cartes vitrines
    document.addEventListener('DOMContentLoaded', () => {
        const grid = document.getElementById('gridFormations');
        grid.innerHTML = catalogue.map(item => `
            <div class="card-formation">
                <h3>${item.titre}</h3>
                <div class="card-slogan">${item.slogan}</div>
                <div class="card-price">${item.prix}</div>
                <button type="button" class="btn-select" onclick="choisirFormation('${item.titre}')">S'inscrire à cette formation</button>
            </div>
        `).join('');
    });

    // Fonction quand l'utilisateur clique sur "S'inscrire à cette formation"
    function choisirFormation(nomFormation) {
        const select = document.getElementById('formation');
        select.value = nomFormation;
        
        // Passer au formulaire
        document.getElementById('welcomeCard').style.display = 'none';
        document.getElementById('formCard').style.display = 'block';
    }

    // Gestion du bouton "Commencer l'inscription"
    document.getElementById('startBtn').addEventListener('click', () => {
        document.getElementById('welcomeCard').style.display = 'none';
        document.getElementById('formCard').style.display = 'block';
    });
</script>
</body>
</html>
