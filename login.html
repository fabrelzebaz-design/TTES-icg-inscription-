<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Admin - TTES-ICG</title>
    <style>
        :root { --primary: #4F46E5; --bg: #F3F4F6; }
        * { box-sizing: border-box; font-family: 'Inter', 'Segoe UI', sans-serif; }
        body { background: var(--bg); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); width: 100%; max-width: 400px; }
        h2 { margin-top: 0; color: #1F2937; font-size: 22px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #4B5563; font-size: 14px; }
        input { width: 100%; padding: 12px; border: 1px solid #D1D5DB; border-radius: 8px; font-size: 15px; }
        input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #4338CA; }
        button:disabled { background: #9CA3AF; cursor: not-allowed; }
        .error { color: #EF4444; font-size: 14px; text-align: center; margin-top: 15px; display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>🔐 Connexion Admin</h2>
    <form id="loginForm">
        <div class="form-group">
            <label>Identifiant</label>
            <input type="text" id="username" required autocomplete="off">
        </div>
        <div class="form-group">
            <label>Mot de passe</label>
            <input type="password" id="password" required>
        </div>
        <button type="submit" id="submitBtn">Se connecter</button>
        <div id="errorMsg" class="error">Identifiants incorrects !</div>
    </form>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const errorMsg = document.getElementById('errorMsg');
        const submitBtn = document.getElementById('submitBtn');

        // Réinitialisation de l'affichage
        errorMsg.style.display = 'none';
        submitBtn.disabled = true;
        submitBtn.textContent = "Connexion en cours...";

        try {
            const res = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await res.json();

            if (data.success) {
                // CORRECTION : On enregistre exactement la clé attendue par admin.html
                localStorage.setItem('adminToken', 'session_admin_active_ttes_2026');
                window.location.href = '/admin.html';
            } else {
                errorMsg.textContent = data.message || "Identifiants incorrects !";
                errorMsg.style.display = 'block';
            }
        } catch (err) {
            console.error(err);
            errorMsg.textContent = "Le serveur se réveille, réessayez dans 20 secondes...";
            errorMsg.style.display = 'block';
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = "Se connecter";
        }
    });
</script>
